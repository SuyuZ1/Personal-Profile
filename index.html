<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Suyu's personal profile — artificial intelligence and embodied intelligence."
    />
    <meta name="theme-color" content="#08090d" />
    <title>Suyu — Personal Profile</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body class="intro-page">
    <canvas id="neural-canvas" aria-hidden="true"></canvas>

    <section class="intro" id="intro" aria-label="Profile introduction">
      <div class="intro-grid" aria-hidden="true"></div>
      <div class="intro-orbit intro-orbit--outer" aria-hidden="true"></div>
      <div class="intro-orbit intro-orbit--inner" aria-hidden="true"></div>

      <div class="intro-meta intro-meta--top">
        <span>SUYU / PERSONAL PROFILE</span>
        <span>31°13′N&nbsp;&nbsp;121°28′E</span>
      </div>

      <div class="intro-copy intro-copy--classic">
        <p class="eyebrow"><span></span> PERSONAL PROFILE</p>
        <h1>Hello, I'm Suyu.</h1>
        <p class="intro-field">Artificial Intelligence × Embodied Intelligence</p>

        <button class="enter-trigger" id="enter-profile" type="button">
          <span class="enter-trigger__line"></span>
          <span class="enter-trigger__label">Enter profile</span>
          <span class="enter-trigger__arrow" aria-hidden="true">↗</span>
        </button>
      </div>

      <div class="intro-meta intro-meta--bottom">
        <span>INTERFACE / READY</span>
        <span class="system-status"><i></i> SYSTEM ONLINE</span>
      </div>
    </section>
  </body>
</html>
